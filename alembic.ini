[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: This placeholder is NEVER used at runtime. The alembic/env.py
# ``run_migrations_online()`` function always overrides sqlalchemy.url from
# the DATABASE_URL environment variable (set by docker-compose.yml or CI).
# We keep a literal value here (not %(...)s interpolation) to avoid
# ConfigParser.InterpolationMissingOptionError when the section is read
# before the env.py override code executes.
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@postgres/placeholder

# Avoid auto-generating spurious changes caused by GeoAlchemy2 columns that
# don't diff cleanly (PostGIS server-side types vs SQLAlchemy reflection).
compare_type = true
user_module_prefix = ""
render_as_batch = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
