[project]
name = "swat-flood-backend"
version = "0.1.0"
description = "Swat Flood Early-Warning System backend (FastAPI, Clean Architecture)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "geoalchemy2>=0.14",
  "shapely>=2.0",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.1",
  "redis[hiredis]>=5.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt,argon2]>=1.7",
  "slowapi>=0.1.9",
  "limits>=3.10",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "lightgbm>=4.0",
  "xgboost>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "numpy>=1.24,<2.0.0",
  "pandas>=2.0,<2.3.0",
  "shap>=0.44",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "ruff>=0.3",
  "mypy>=1.9",
  "types-redis>=4.6",
  "types-shapely>=2.0",
  "pre-commit>=3.6",
  "testcontainers[postgresql]>=4.4",
  "fakeredis[lua]>=2.24",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package layout:
#   backend/__init__.py                 → top-level "backend" package
#   backend/src/{domain,application,infrastructure,interfaces}
#                                      → backend.src.* subpackages
# Hatchling walks the filesystem from PROJECT_ROOT; we list each top-level
# Python package directory explicitly so it doesn't try to infer from the
# hyphenated project name "swat-flood-backend".
packages = [
  "backend",
]

[tool.hatch.build.targets.wheel.force-include]
# The domain/application/... source tree must also be shipped; hatch
# force-include walks the real filesystem path and maps it onto the wheel.
"backend/src" = "backend/src"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
]
ignore = [
  "E501",  # line length handled by formatter
  "N818",  # exception names are spec-defined in session prompts (e.g. InvalidWaterLevel)
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
mypy_path = "backend/src"
files = ["backend/src", "tests"]
exclude = [
  "alembic",
]
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-ra --strict-markers --cov=domain --cov=application --cov=infrastructure --cov=interfaces --cov-report=term-missing --cov-fail-under=0"
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (database, redis, etc.)",
    "asyncio: marks tests that use asyncio",
]
